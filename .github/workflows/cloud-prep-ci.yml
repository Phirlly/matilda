name: Cloud Prep CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Cloud prep checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect cloud-prep changes
        id: changes
        run: |
          event="${{ github.event_name }}"
          zero="0000000000000000000000000000000000000000"

          if [ "$event" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          elif [ "$event" = "push" ]; then
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            if [ "$head" = "$zero" ]; then
              echo "run_checks=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$base" = "$zero" ]; then
              base="$(git hash-object -t tree /dev/null)"
            fi
          else
            echo "run_checks=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "$base..$head")"
          if printf '%s\n' "$changed_files" | grep -E '^(matilda-cloud-prep/|\.github/workflows/cloud-prep-ci\.yml$)' >/dev/null; then
            echo "run_checks=true" >> "$GITHUB_OUTPUT"
            echo "base=$base" >> "$GITHUB_OUTPUT"
            echo "head=$head" >> "$GITHUB_OUTPUT"
          else
            echo "No cloud-prep changes detected; required check passes without running project validation."
            echo "run_checks=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check committed diff whitespace
        if: steps.changes.outputs.run_checks == 'true'
        run: git diff --check "${{ steps.changes.outputs.base }}..${{ steps.changes.outputs.head }}"

      - name: Verify cloud-prep local-only files are not tracked
        if: steps.changes.outputs.run_checks == 'true'
        run: |
          disallowed="$(
            git ls-files \
              matilda-cloud-prep/PLAN.md \
              matilda-cloud-prep/docs \
              matilda-cloud-prep/coverage.out \
              matilda-cloud-prep/handoff \
              matilda-cloud-prep/packages \
              matilda-cloud-prep/logs \
              matilda-cloud-prep/tmp \
              matilda-cloud-prep/matilda-prep \
              || true
          )"
          if [ -n "$disallowed" ]; then
            echo "Local-only or generated cloud-prep files must not be tracked:"
            echo "$disallowed"
            exit 1
          fi

      - name: Verify cloud-prep Go module exists
        if: steps.changes.outputs.run_checks == 'true'
        run: |
          if [ ! -f matilda-cloud-prep/go.mod ]; then
            echo "matilda-cloud-prep/go.mod is required for Cloud Prep validation."
            exit 1
          fi

      - name: Set up Go
        if: steps.changes.outputs.run_checks == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: matilda-cloud-prep/go.mod
          cache: false

      - name: Check Go formatting
        if: steps.changes.outputs.run_checks == 'true'
        working-directory: matilda-cloud-prep
        run: test -z "$(gofmt -l cmd internal)"

      - name: Run Go tests
        if: steps.changes.outputs.run_checks == 'true'
        working-directory: matilda-cloud-prep
        run: go test ./...

      - name: Run Go vet
        if: steps.changes.outputs.run_checks == 'true'
        working-directory: matilda-cloud-prep
        run: go vet ./...

      - name: Build matilda-prep
        if: steps.changes.outputs.run_checks == 'true'
        working-directory: matilda-cloud-prep
        run: go build ./cmd/matilda-prep
