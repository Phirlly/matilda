name: Cloud Prep CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Cloud prep checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect cloud-prep changes
        id: changes
        run: |
          event="${{ github.event_name }}"
          zero="0000000000000000000000000000000000000000"

          if [ "$event" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          elif [ "$event" = "push" ]; then
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            if [ "$head" = "$zero" ]; then
              echo "run_checks=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$base" = "$zero" ]; then
              base="$(git hash-object -t tree /dev/null)"
            fi
          else
            echo "run_checks=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "$base..$head")"
          if printf '%s\n' "$changed_files" | grep -E '^(matilda-cloud-prep/|\.github/workflows/cloud-prep-ci\.yml$)' >/dev/null; then
            echo "run_checks=true" >> "$GITHUB_OUTPUT"
          else
            echo "No cloud-prep changes detected; required check passes without running project validation."
            echo "run_checks=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check cloud-prep bootstrap is validation-safe
        if: steps.changes.outputs.run_checks == 'true'
        run: |
          if [ ! -d matilda-cloud-prep ]; then
            echo "No tracked matilda-cloud-prep project files yet."
            exit 0
          fi

          if [ -f matilda-cloud-prep/go.mod ]; then
            echo "matilda-cloud-prep/go.mod exists, but Cloud Prep CI has not been updated with Go validation."
            echo "Add setup-go, go test, go vet, and build checks before merging product code."
            exit 1
          fi

          tracked_files="$(git ls-files matilda-cloud-prep)"
          if [ -z "$tracked_files" ]; then
            echo "No tracked matilda-cloud-prep project files yet."
            exit 0
          fi

          disallowed="$(
            printf '%s\n' "$tracked_files" \
              | grep -Ev '^matilda-cloud-prep/README\.md$' || true
          )"
          if [ -n "$disallowed" ]; then
            echo "Cloud Prep CI only allows README.md until real project validation is configured."
            echo "Unexpected tracked files:"
            echo "$disallowed"
            exit 1
          fi

          echo "matilda-cloud-prep has no Go module yet; README-only bootstrap is allowed."
